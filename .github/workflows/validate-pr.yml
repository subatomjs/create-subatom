name: Validate Pull Request

on:
    push:
        branches:
            - main
    pull_request:
        branches:
            - main
        types: [opened, synchronize, reopened, ready_for_review]

# Cancel in-progress runs on the same branch when new commits are pushed
concurrency:
    group: ${{ github.workflow }}-${{ github.head_ref || github.ref_name }}
    cancel-in-progress: true

jobs:
    validate:
        # Run if it's a push event, or if it's a PR that is not a draft
        if: github.event.pull_request == null || github.event.pull_request.draft == false
        runs-on: ubuntu-latest

        steps:
            - name: Checkout Code
              uses: actions/checkout@v4

            - name: Setup Node.js
              uses: actions/setup-node@v4
              with:
                  node-version: 24
                  cache: "npm"

            - name: Install Dependencies
              run: npm ci --ignore-scripts
              env:
                  HUSKY: 0

            - name: Typecheck
              run: npm run typecheck

            - name: Biome Linter
              run: npm run lint

            - name: Unit Tests
              run: npm run test:unit

            - name: Test Build Pipeline
              run: npm run build
